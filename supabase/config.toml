# Supabase CLI project configuration.
#
# This file lets the Supabase CLI (https://supabase.com/docs/guides/cli)
# manage this project locally: linking to your real Supabase project,
# pushing supabase/schema.sql, and deploying supabase/functions/.
#
# It does NOT contain any secret — project_id is just which Supabase
# project this local folder is linked to, set by `supabase link`, not
# typed in by hand.
project_id = "mandi"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Local dev only — your real project's Site URL / Redirect URLs are set
# in the Supabase Dashboard (Authentication → URL Configuration), not here.
site_url = "http://localhost:3000"
additional_redirect_urls = ["mandi://auth-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = true
